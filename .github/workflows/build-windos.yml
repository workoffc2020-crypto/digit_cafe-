name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps "rapidocr-onnxruntime>=1.3"
      - run: python tools/make_icon.py
      - run: python -m pytest tests -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: pyinstaller CyberCafeStudio.spec --noconfirm
      - name: Test packaged executable
        run: dist\CyberCafeStudio\CyberCafeStudio.exe --selftest
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CyberCafeStudio.iss'
      - uses: actions/upload-artifact@v4
        with: { name: CyberCafeStudio_Setup, path: dist_installer/CyberCafeStudio_Setup.exe }
